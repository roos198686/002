name: Build Unsigned iOS IPA

# 推送 main 自動構建；也可手動觸發：GitHub 倉庫頁 -> Actions -> 左側選 "Build Unsigned iOS IPA" -> Run workflow
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 只跑 vite 打包（跳過 vue-tsc，倉庫內有歷史遺留型別錯誤不影響產物）
      - name: Build web assets
        run: npx vite build

      # ios/ 工程已隨倉庫提交（含 AppPermission 原生插件），只需同步 web 產物
      - name: Sync web assets to iOS
        run: npx cap sync ios

      # Capacitor 8 只註冊 capacitor.config.json 白名單內的插件，
      # 手工內建的 AppPermission 需在 sync 後注入 packageClassList
      - name: Register custom AppPermission plugin
        run: node scripts/inject-ios-plugin.cjs

      # 無簽名構建（真機 arm64），SPM 自動解析 Capacitor 依賴
      - name: Build unsigned App.app (iphoneos)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      # 按標準結構 Payload/App.app 打包成可重簽名的無簽名 IPA
      - name: Package unsigned IPA
        working-directory: ios/App
        run: |
          mkdir -p Payload
          cp -r derived/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr SKS-unsigned.ipa Payload
          ls -lh SKS-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKS-unsigned-IPA
          path: ios/App/SKS-unsigned.ipa
          retention-days: 30
